<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron House · Administración de Gimnasio (Demo)</title>
  <meta name="description" content="Demo del sistema de administración de gimnasio.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>
          </svg>
        </div>
        <div>
          <h1>Iron House</h1>
          <small>Gym Manager</small>
        </div>
      </div>
      <div class="nav-label">Principal</div>
      <nav class="nav" id="nav"></nav>
      <div class="footer">
        Demo estática · v1.0<br>
        Sistema en LAN · Django + PostgreSQL
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title">
          <h2 id="pageTitle">Dashboard</h2>
          <div class="sub" id="pageSub"></div>
        </div>
        <div class="rate-chip">
          <span class="dot"></span> Tasa BCV <b id="bcv"></b> Bs/USD
        </div>
        <button class="reset-btn" id="resetBtn" title="Volver a los datos de ejemplo">↺ Restablecer</button>
        <div class="avatar">AD</div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>
  <div class="demo-flag">● DEMO · datos de ejemplo</div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
